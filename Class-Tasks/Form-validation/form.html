<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <form id="form" class="border shadow p-5 w-50">
            <div class="text-center mb-4">
                <span class="mt-2 fw-bold fs-2">Join Us</span>
                <span class="bi bi-people-fill fs-1" style="color: #6f42c1;"></span>
                
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="username">Full Name</label><br>
                    <input type="text" id="user" placeholder="Your full name" class="w-100 form-control">
                    <p id="user-error" class="text-danger"></p>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="email">Email Address</label><br>
                    <input type="text" id="email" placeholder="you@example.com" class="w-100 form-control">
                    <p id="email-error" class="text-danger"></p>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="phonenumber">Phone Number</label><br>
                    <input type="text" id="phone" placeholder="Enter 10 digit number" maxlength=10 class="w-100 form-control">
                    <p id="phone-error" class="text-danger"></p>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="password">Password</label><br>
                    <input type="password" id="pswd" placeholder="Minimum 6 characters" class="w-100 form-control">
                    <span id="strength"></span>
                    <p id="pswd-error" class="text-danger"></p>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <label for="confirmpassword">Confirm Password</label><br>
                    <input type="password" id="conf" placeholder="Re-enter Your password" class="w-100 form-control">
                    <p id="conf-error" class="text-danger"></p>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12">
                    <input type="submit" value="Create Account" class="w-100 py-2 rounded text-white border-0 fw-semibold" style="background-color: #3d1784;">
                    <div id="final"></div>
                </div>
            </div>
                
            
        </form>
    </div>
    <!-- JavaScript -->
     <script src="form.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
