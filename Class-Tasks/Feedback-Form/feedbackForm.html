    <div id="card" class="card d-flex justify-content-center gap-3 border p-5">
        <h2 id="title">Feedback Form</h2>
        <input type="text" id="name" maxlength="20" placeholder="Enter your name">
        <span id="count"  >0/20 characters</span>

        </form>
        <p id="msg" class="mt-3 " ></p>
    </div>
    </div>
